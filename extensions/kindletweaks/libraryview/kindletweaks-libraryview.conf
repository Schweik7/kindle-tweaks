# 默认收藏夹视图：KPPMainApp 启动前先校正一次；之后只等待图书馆导航事件。
# 阻塞在 lipc-wait-event，不轮询、不周期唤醒 CPU。
description "kindle-tweaks: keep collections as the default library view"
start on starting kppmainapp
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	EXT=/mnt/us/extensions/kindletweaks
	rc=0
	[ -f ${EXT}/tweak.sh ] && sh ${EXT}/tweak.sh libraryview apply >/dev/null 2>&1 || rc=$?
	while true; do
		# 不用 -m 后接管道：lipc-wait-event 的 stdout 在管道中会缓冲，事件不能及时处理。
		event=$(lipc-wait-event com.lab126.appmgrd historyChange 2>/dev/null) || { sleep 5; continue; }
		case "${event}" in
			*KPP_LIBRARY*)
				rc=0
				sh ${EXT}/tweak.sh libraryview apply >/dev/null 2>&1 || rc=$?
				if [ ${rc} = 10 ]; then
					# 当前书库模型已经按旧模式创建，重载一次才会读取校正后的配置。
					restart kppmainapp >/dev/null 2>&1
					# 新 KPP 注册 lipc 服务（约 7 秒）后，appmgrd 会自动把它恢复到图书馆。
					# 在此之前发 start 会因服务不存在而弹「启动应用程序出错」，所以只等这次恢复。
					event=$(lipc-wait-event -s 40 com.lab126.appmgrd historyChange 2>/dev/null)
					if [ -z "${event}" ]; then
						# 没等到自动恢复：确认 KPP 已就绪后补发一次。
						for i in $(seq 1 20); do lipc-probe com.lab126.KPPMainApp >/dev/null 2>&1 && break; sleep 1; done
						lipc-set-prop com.lab126.appmgrd start "app://com.lab126.KPPMainApp/?view=KPP_LIBRARY" >/dev/null 2>&1
					fi
				fi
				;;
		esac
	done
end script
