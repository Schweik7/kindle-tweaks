# 默认收藏夹视图：KPPMainApp 启动前先校正一次；之后每次进入屏保时再校正。
# 屏保盖住屏幕，重载 KPP 的白屏看不到；使用中临时切到「全部 / 网格」会保持到这次用完。
# 阻塞在 lipc-wait-event，不轮询、不周期唤醒 CPU。
description "kindle-tweaks: keep collections as the default library view"
start on starting kppmainapp
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	EXT=/mnt/us/extensions/kindletweaks
	[ -f ${EXT}/tweak.sh ] && sh ${EXT}/tweak.sh libraryview apply >/dev/null 2>&1
	while true; do
		lipc-wait-event com.lab126.powerd goingToScreenSaver >/dev/null 2>&1 || { sleep 5; continue; }
		rc=0
		sh ${EXT}/tweak.sh libraryview apply >/dev/null 2>&1 || rc=$?
		# 10 = 刚改了配置：KPP 只在启动时读它，重载一次（appmgrd 会在唤醒后恢复原来的界面）
		[ ${rc} = 10 ] && restart kppmainapp >/dev/null 2>&1
	done
end script
