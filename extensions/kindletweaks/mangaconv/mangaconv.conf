# 漫画 epub 自动转 PDF：充电时处理 documents 里的大 epub（/mnt/us/extensions/kindletweaks/mangaconv）
description "manga epub -> pdf while charging"
start on started framework
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	cd /
	EXT=/mnt/us/extensions/kindletweaks
	LAST=""
	sleep 120
	while true; do
		# 只在充电、且 U 盘区可用时才检查；平时每分钟一次 lipc 查询，几乎不耗电
		if [ "$(lipc-get-prop com.lab126.powerd isCharging 2>/dev/null)" = "1" ] && [ -f $EXT/tweak.sh ] && [ -d /mnt/us/documents ]; then
			# 粗筛 >10MB 的 epub（真正的大小阈值由 Python 按 config.json 判断）；列表没变且上次已处理完就不再启动 Python
			SIG=$( (find /mnt/us/documents -name "*.epub" -size +10240k -exec ls -l {} + 2>/dev/null; cat $EXT/mangaconv/config.json 2>/dev/null) | md5sum | cut -c1-32)
			if [ "$SIG" != "$LAST" ]; then
				nice -n 19 ionice -c 3 sh $EXT/tweak.sh manga autorun && LAST="$SIG"
			fi
		fi
		sleep 60
	done
end script
