# epub 自动转换：文字书传完即转 AZW3，大漫画充电时转 PDF（/mnt/us/extensions/kindletweaks/mangaconv）
description "epub -> azw3 when ready, manga -> pdf while charging"
start on started framework
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	cd /
	EXT=/mnt/us/extensions/kindletweaks
	LAST=""
	SEEN=""
	# framework 启动后稍等 U 盘区和 Python 扩展稳定。
	sleep 30
	while true; do
		if [ -f $EXT/tweak.sh ] && [ -d /mnt/us/documents ]; then
			# 连续两次签名相同才处理，避免 scp 尚未写完时打开半截 epub。电源状态也放进
			# 签名：文字书不等充电；等待中的漫画会在接上电源后重新进入队列。
			POWER=$(lipc-get-prop com.lab126.powerd isCharging 2>/dev/null)
			SIG=$( (find /mnt/us/documents -name "*.epub" -exec ls -l {} + 2>/dev/null; cat $EXT/mangaconv/config.json 2>/dev/null; echo "charging=$POWER") | md5sum | cut -c1-32)
			if [ "$SIG" != "$SEEN" ]; then
				SEEN="$SIG"
			elif [ "$SIG" != "$LAST" ]; then
				nice -n 19 ionice -c 3 sh $EXT/tweak.sh manga autorun
				RC=$?
				case "$RC" in 0|3) LAST="$SIG" ;; esac
			fi
		fi
		sleep 30
	done
end script
