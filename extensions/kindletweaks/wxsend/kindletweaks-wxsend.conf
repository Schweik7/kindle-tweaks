# 微信传书：从 VPS 拉取微信里发来的书，放进 documents（mangaconv 会接着转换）。
# 同步时机由 wxsend/config 的 INTERVAL 决定（每轮重读，改了不用重启任务）：
#   INTERVAL=0（默认）  只在亮屏（出屏保）时同步，最省电
#   INTERVAL=N         亮屏时同步，醒着时再每 N 分钟同步一次
# 屏保和休眠期间都阻塞在 lipc-wait-event，不唤醒 CPU。
description "kindle-tweaks: pull books sent via WeChat"
start on started framework
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	EXT=/mnt/us/extensions/kindletweaks
	sleep 20
	while true; do
		[ -f ${EXT}/tweak.sh ] && sh ${EXT}/tweak.sh wxsend autopull >/dev/null 2>&1
		N=$(sed -n 's/^INTERVAL=\([0-9]*\).*/\1/p' ${EXT}/wxsend/config 2>/dev/null | head -1)
		T0=$(date +%s)
		if [ "${N:-0}" -gt 0 ]; then
			lipc-wait-event -s $((N * 60)) com.lab126.powerd outOfScreenSaver >/dev/null 2>&1
		else
			lipc-wait-event com.lab126.powerd outOfScreenSaver >/dev/null 2>&1
		fi
		# powerd 还没起来时 lipc-wait-event 会立刻返回，别空转
		[ $(($(date +%s) - T0)) -lt 5 ] && sleep 30
	done
end script
