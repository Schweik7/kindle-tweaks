# 微信传书：从 VPS 拉取微信里发来的书，放进 documents（mangaconv 会接着转换）。
# 亮屏（出屏保）时立刻拉一次，醒着时每 5 分钟拉一次；屏保和休眠期间阻塞在 lipc-wait-event，不唤醒 CPU。
description "kindle-tweaks: pull books sent via WeChat"
start on started framework
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	EXT=/mnt/us/extensions/kindletweaks
	sleep 20
	while true; do
		[ -f ${EXT}/tweak.sh ] && sh ${EXT}/tweak.sh wxsend autopull >/dev/null 2>&1
		T0=$(date +%s)
		lipc-wait-event -s 300 com.lab126.powerd outOfScreenSaver >/dev/null 2>&1
		# powerd 还没起来时 lipc-wait-event 会立刻返回，别空转
		[ $(($(date +%s) - T0)) -lt 5 ] && sleep 30
	done
end script
