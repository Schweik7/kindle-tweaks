# 上下翻页键同时按住 → 截屏。
# 守护进程（X 客户端）在 root window 上 XGrabKey 抢走 PageUp/PageDown：
# 组合成立时把这一对按键整个吞掉（阅读器收不到，画面不翻页），随后截图；
# 单键则临时放开、用 XTEST 伪装成 keypad 设备原样重放，翻页照常。
description "kindle-tweaks: both page buttons take a screenshot"
start on started framework
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300
env DISPLAY=:0
exec /mnt/us/extensions/kindletweaks/keyshot/keyshot
