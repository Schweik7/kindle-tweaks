# 调试模式：允许屏保，按所选模式阻止进入深度休眠。
description "kindle-tweaks: configurable deep sleep deferral"
start on started framework
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	while true; do
		# powerd 准备 suspend 时才允许设置 deferSuspend；平时直接设置会报 InvalidState。
		lipc-wait-event -m com.lab126.powerd readyToSuspend 2>/dev/null | while read -r event; do
			MODE=$(cat /mnt/us/extensions/kindletweaks/debugawake/mode 2>/dev/null)
			[ -n "${MODE}" ] || MODE=charging
			DEFER=0
			[ "${MODE}" = always ] && DEFER=1
			[ "${MODE}" = charging ] && [ "$(lipc-get-prop com.lab126.powerd isCharging 2>/dev/null)" = "1" ] && DEFER=1
			if [ "${DEFER}" = 1 ]; then
				lipc-set-prop -i com.lab126.powerd deferSuspend 300 >/dev/null 2>&1
			fi
		done
		# lipc-wait-event 异常退出时避免 respawn/重试忙循环。
		sleep 5
	done
end script
