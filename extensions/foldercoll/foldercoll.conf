# 文件夹收藏夹：书库内容变化时自动同步（/mnt/us/extensions/foldercoll）
description "folder -> collections sync"
start on started framework
stop on (stopping framework or ota-update)
respawn
respawn limit 5 300

script
	cd /
	LAST=""
	sleep 90
	while true; do
		if [ -f /mnt/us/extensions/foldercoll/run.sh ] && [ -f /tmp/session_token ]; then
			SIG=$( (sqlite3 /var/local/cc.db "select p_location from Entries where p_type='Entry:Item' and p_location like '/mnt/us/documents/%' order by 1; select p_uuid from Entries where p_type='Collection' order by 1" 2>/dev/null; cat /mnt/us/extensions/foldercoll/config.json 2>/dev/null) | md5sum | cut -c1-32)
			if [ "$SIG" != "$LAST" ]; then
				sh /mnt/us/extensions/foldercoll/run.sh && LAST="$SIG"
			fi
		fi
		sleep 60
	done
end script